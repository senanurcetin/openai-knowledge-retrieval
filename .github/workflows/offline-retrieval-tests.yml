name: Offline retrieval evaluation tests

on:
  pull_request:
    paths:
      - 'evals/metrics/**'
      - 'evals/datasets/**'
      - 'evals/generator/auto_pipeline.py'
      - 'evals/generator/sampler.py'
      - 'evals/generator/test_sampler.py'
      - 'evals/generator/test_quality_gate.py'
      - 'evals/reporters/**'
      - 'evals/runners/local_judge.py'
      - 'evals/runners/test_single_pass.py'
      - 'retrieval/pipeline.py'
      - 'evals/harness.py'
      - 'cli/config.py'
      - '.github/workflows/offline-retrieval-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-retrieval:
    name: Offline Retrieval / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: >-
          python -m pip install
          'pytest>=8,<10' 'pydantic>=2.7,<3'
          'rich>=13,<15' 'pyyaml>=6,<7'
          'openai>=1.40,<3' 'python-dotenv>=1,<2'
      - name: Check offline metrics and reports
        run: >-
          python -m pytest -q
          evals/datasets/test_schema.py
          evals/generator/test_quality_gate.py
          evals/generator/test_sampler.py
          evals/metrics/test_qa.py
          evals/metrics/test_retrieval.py
          evals/reporters/test_md.py
          evals/reporters/test_retrieval_metrics.py
          evals/reporters/test_quality_summary.py
          evals/reporters/test_run_identity.py
          evals/metrics/test_retrieval_capture.py
          evals/runners/test_single_pass.py
      - name: Compile modified integration modules
        run: python -m compileall -q retrieval/pipeline.py evals/harness.py cli/config.py evals/runners/local_judge.py evals/datasets/schema.py evals/generator/auto_pipeline.py evals/generator/sampler.py
